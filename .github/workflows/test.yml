name: Build and Test

on:
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `i18n-core` is multiplatform and has no `test` task. `allTests` runs its tests on every target the host can
      # run: here JVM, JS and Wasm in Node and in headless Chrome, Wasm WASI and Linux x64; the Apple and Windows
      # targets are skipped.
      - name: Run Tests
        run: |
          chmod +x gradlew
          ./gradlew test :i18n-core:allTests

  test-example:
    runs-on: ubuntu-latest
    # `example/` is a build of its own that includes this one, and the only place generated code is compiled and
    # called. The plugin's own tests stop at what it reads from the files.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Example Tests
        working-directory: example
        run: |
          chmod +x gradlew
          ./gradlew test
